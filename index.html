<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <title>Skilled</title>
</head>

<body>
  <header>
    <div class="logo">
      <img src="./assets/logo-dark.svg" alt="Skilled">
    </div>
    <button class="btn">Get Started</button>
  </header>
  <main>
    <section class="hero">
      <div class="hero-content">
        <div class="hero-content-text">
          <h1>Maximize skill, minimize budget</h1>
          <p>Our modern courses across a range of in-demand skills will give you the knowledge you need to live the life you want.</p>
          <button class="btn">Get Started</button>
        </div>
        <div class="hero-content-image">
          <div class="image-container-background"></div>
          <div class="image-container">
            <img src="./assets/photo.png" alt="girl-photo">
          </div>
          <div class="members image-card">
            <p class="card-title">Members</p>
            <p class="card-value">29k</p>
          </div>
          <div class="hours image-card">
            <p class="card-title">Course hours</p>
            <p class="card-value">1,451</p>
          </div>
        </div>
      </div>
    </section>
    <section class="features"></section>
  </main>
  <footer>
    <div class="logo">
      <img src="./assets/logo-light.svg" alt="Skilled">
    </div>
    <button class="btn">Get Started</button>
  </footer>
</body>

</html>
